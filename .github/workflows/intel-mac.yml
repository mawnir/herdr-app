      - name: Build and install
        run: just install

      - name: Show what was produced
        run: |
          echo "--- app bundle ---"
          ls -la ~/Applications/ || true
          echo "--- binaries in target ---"
          find target -maxdepth 3 -type f -perm +111 -name "herdr*" || true
          echo "--- local bin ---"
          ls -la ~/.local/bin || true

      - name: Package
        run: |
          mkdir -p out
          if [ -d "$HOME/Applications/Herdr.app" ]; then
            ditto -c -k --sequesterRsrc --keepParent "$HOME/Applications/Herdr.app" out/Herdr-macos-x86_64.zip
          fi
          find target/release -maxdepth 1 -type f -name "herdr-app*" -exec cp {} out/ \; || true
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: herdr-app-macos-x86_64
          path: out/*
          if-no-files-found: error
